name: Security & Deploy Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BUILD_TYPE: Release

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Enhanced security scan
      run: |
        echo "Running comprehensive security scan..."
        echo "====================================="
        
        # Check for exposed environment variables
        echo "Checking for exposed environment variables..."
        if [ -f .env ]; then
          echo "Warning: .env file found in repository"
          grep -E "(PASSWORD|SECRET|KEY|TOKEN)" .env && echo "Critical: Sensitive data may be exposed" || echo ".env appears safe"
        fi
        
        # Check for hardcoded credentials in all files
        echo "Scanning for hardcoded credentials..."
        grep -rE "(password|api_key|secret|token)\s*=\s*['\"][^'\"]{8,}" . --include="*.py" --include="*.js" --include="*.cpp" 2>/dev/null | head -5 || echo "No obvious credentials found"
        
        # Check SQL injection vulnerabilities
        echo "Checking for SQL injection patterns..."
        grep -rE "(execute|query)\s*\([^)]*\+[^)]*\)" . --include="*.py" 2>/dev/null || echo "No SQL concatenation found"
        
        # Check for unsafe functions
        echo "Checking for unsafe Python functions..."
        grep -rE "(eval|exec|__import__|compile)\s*\(" . --include="*.py" 2>/dev/null || echo "No unsafe functions found"
        
        # Security scan specific test file
        if [ -f tests/securitytestcase.py ]; then
          echo "Security test file found - good practice!"
        fi

    - name: Python dependency vulnerability scan
      run: |
        echo "Scanning Python dependencies for vulnerabilities..."
        pip install safety bandit
        
        if [ -f requirements.txt ]; then
          safety check --file requirements.txt --json > safety_report.json 2>&1 || true
          echo "Safety scan complete"
        fi
        
        # Run bandit security linter
        if [ -f app.py ]; then
          bandit -r app.py -f json -o bandit_report.json || true
          echo "Bandit scan complete"
        fi
        
        # Scan test files for security issues
        bandit -r tests/ -f txt || echo "Test files scanned"

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-reports
        path: |
          safety_report.json
          bandit_report.json
        if-no-files-found: ignore

  code-quality-gates:
    runs-on: ubuntu-latest
    needs: [security-scan]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install quality tools
      run: |
        pip install black flake8 pylint mypy radon

    - name: Enforce code formatting standards
      run: |
        echo "Enforcing code formatting standards..."
        echo "====================================="
        
        # Format check with black
        black --check app.py tests/ --verbose 2>&1 | tee formatting_report.txt || {
          echo "Code formatting issues detected"
          echo "To fix: black app.py tests/"
        }
        
        # Check type hints with mypy
        echo "Checking type hints..."
        mypy app.py --ignore-missing-imports --no-error-summary 2>&1 | tee -a type_check_report.txt || echo "Type checking complete"
        
        # Calculate code metrics
        echo "Calculating code quality metrics..."
        echo "Code Quality Metrics" > metrics_report.txt
        echo "===================" >> metrics_report.txt
        
        # Cyclomatic complexity
        echo -e "\nCyclomatic Complexity:" >> metrics_report.txt
        radon cc app.py tests/ -a >> metrics_report.txt
        
        # Maintainability index
        echo -e "\nMaintainability Index:" >> metrics_report.txt
        radon mi app.py tests/ >> metrics_report.txt
        
        # Raw metrics
        echo -e "\nRaw Metrics:" >> metrics_report.txt
        radon raw app.py tests/ >> metrics_report.txt

    - name: Generate quality gate report
      run: |
        echo "Quality Gate Report" > quality_gate_report.txt
        echo "==================" >> quality_gate_report.txt
        echo "Timestamp: $(date)" >> quality_gate_report.txt
        echo "" >> quality_gate_report.txt
        
        # Count issues
        if [ -f formatting_report.txt ]; then
          formatting_issues=$(grep -c "would be reformatted" formatting_report.txt || echo "0")
          echo "Formatting Issues: $formatting_issues" >> quality_gate_report.txt
        fi
        
        # Check complexity thresholds
        echo "Complexity Analysis:" >> quality_gate_report.txt
        radon cc app.py -n C | grep -c "C " || echo "0 high complexity functions" >> quality_gate_report.txt
        
        # Test file compliance
        echo "" >> quality_gate_report.txt
        echo "Test Files Found:" >> quality_gate_report.txt
        ls -la tests/*.py >> quality_gate_report.txt
        
        cat quality_gate_report.txt

    - name: Upload quality reports
      uses: actions/upload-artifact@v4
      with:
        name: quality-gate-reports
        path: |
          formatting_report.txt
          type_check_report.txt
          metrics_report.txt
          quality_gate_report.txt
        if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    needs: [code-quality-gates]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Prepare build context
      run: |
        echo "Organizing project structure for Docker build..."
        mkdir -p src database
        
        # Ensure tests are in correct location
        if [ -d tests ]; then
          echo "Tests directory found with $(ls tests/ | wc -l) files"
        fi
        
        # Move database files if needed
        [ -f schema.sql ] && mv schema.sql database/ || true
        [ -f seed.sql ] && mv seed.sql database/ || true

    - name: Build Docker image
      run: |
        if [ -f Dockerfile ]; then
          docker build -t stock-predictor:latest . || echo "Docker build needs debugging"
          
          # Run security scan on Docker image
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image stock-predictor:latest || echo "Trivy scan complete"
        else
          echo "Dockerfile not found, skipping Docker build"
        fi

    - name: Test Docker container
      if: success()
      run: |
        if docker images | grep -q stock-predictor; then
          docker run -d --name test-container -p 5000:5000 stock-predictor:latest
          sleep 5
          
          # Test endpoints
          curl -f http://localhost:5000/health || echo "Health check"
          
          # Cleanup
          docker stop test-container && docker rm test-container
        fi

    - name: Tag and document build
      if: success()
      run: |
        BUILD_TAG="build-$(date +%Y%m%d-%H%M%S)"
        echo "Build Information" > build_info.txt
        echo "================" >> build_info.txt
        echo "Tag: $BUILD_TAG" >> build_info.txt
        echo "Commit: ${{ github.sha }}" >> build_info.txt
        echo "Branch: ${{ github.ref }}" >> build_info.txt
        echo "Timestamp: $(date)" >> build_info.txt
        echo "" >> build_info.txt
        echo "Test Files Included:" >> build_info.txt
        ls tests/*.py >> build_info.txt
        
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag -a "$BUILD_TAG" -m "Automated build tag" || echo "Tag exists"

    - name: Upload build information
      uses: actions/upload-artifact@v4
      with:
        name: build-information
        path: build_info.txt

  sprint-deliverable-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Comprehensive deliverable verification
      run: |
        echo "Sprint Deliverable Verification"
        echo "==============================="
        
        # Required core files
        required_files=(
          "README.md"
          "app.py"
        )
        
        # Test files that should exist
        test_files=(
          "tests/ML_testcases.py"
          "tests/router_test.cpp"
          "tests/securitytestcase.py"
          "tests/stock_api_testcase.py"
        )
        
        # Check required files
        echo "Checking required files..."
        for file in "${required_files[@]}"; do
          if [ -f "$file" ]; then
            echo "✓ $file ($(wc -l < "$file") lines)"
          else
            echo "✗ $file missing"
            exit 1
          fi
        done
        
        # Check test files
        echo -e "\nChecking test suite..."
        test_count=0
        for file in "${test_files[@]}"; do
          if [ -f "$file" ]; then
            echo "✓ $file found"
            test_count=$((test_count + 1))
          else
            echo "⚠ $file not found"
          fi
        done
        
        echo -e "\nTest Coverage: $test_count/4 test files present"
        
        # Generate comprehensive report
        echo -e "\nProject Statistics:"
        echo "Total Python files: $(find . -name '*.py' | wc -l)"
        echo "Total test files: $(ls tests/* 2>/dev/null | wc -l)"
        echo "Lines of Python code: $(find . -name '*.py' -exec cat {} \; | wc -l)"
        echo "Lines in tests: $(find tests -name '*.py' -exec cat {} \; 2>/dev/null | wc -l)"

    - name: Generate final deliverable report
      run: |
        echo "Sprint Deliverable Report" > deliverable_report.txt
        echo "========================" >> deliverable_report.txt
        echo "Generated: $(date)" >> deliverable_report.txt
        echo "Repository: ${{ github.repository }}" >> deliverable_report.txt
        echo "Commit: ${{ github.sha }}" >> deliverable_report.txt
        echo "" >> deliverable_report.txt
        echo "Project Structure:" >> deliverable_report.txt
        tree -L 2 --filesfirst 2>/dev/null || find . -type f -name "*.py" -o -name "*.cpp" | head -20 >> deliverable_report.txt
        
    - name: Upload deliverable report
      uses: actions/upload-artifact@v4
      with:
        name: sprint-deliverable-report
        path: deliverable_report.txt
